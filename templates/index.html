<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Intérprete OLC1</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>
<body>
  <!-- Franja superior -->
  <div class="header-bar">
    <h1>Intérprete OLC1</h1>
    <div class="top-buttons">
      <form method="get" action="/errores">
        <input type="hidden" name="data" value="{{ errores|e }}">
        <button type="submit">Reporte de Errores</button>
      </form>
      <form method="get" action="/tabla_simbolos">
        <button type="submit">Tabla de Símbolos</button>
      </form>
      <form method="get" action="/ast">
        <button type="submit">AST</button>
      </form>
      <form method="get" action="/vectores">
        <button type="submit">Reporte de Vectores</button>
      </form>
    </div>
  </div>
  <!-- Panel de Entrada -->
  <div class="panel entrada">
    <form method="POST" enctype="multipart/form-data">
      <label>Entrada:</label>
      <div class="botones">
        <input type="file" name="archivo" accept=".objc">
        <button type="submit" name="cargar">Cargar archivo</button>
        <button type="submit" name="interpretar">Interpretar</button>
      </div>
      <textarea name="entrada">{{ entrada }}</textarea>
    </form>
  </div>
  <!-- Panel de Salida -->
  <div class="panel salida">
    <label>Salida:</label>
    <pre class="salida-content">{{ salida }}</pre>
  </div>
</body>
</html>
