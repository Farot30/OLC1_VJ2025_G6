<!DOCTYPE html>
<html lang="es">
<head>
    <head>
    <meta charset="UTF-8">
    <title>Intérprete OLC1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles/styles.css') }}">
</head>
</head>
<body>
    <h1>Intérprete OLC1</h1>
    <div class="panel">
        <form method="POST" enctype="multipart/form-data">
            <label>Entrada:</label><br>
            <textarea name="entrada">{{ entrada }}</textarea><br>
            <div class="botones">
                <input type="file" name="archivo" accept=".objc">
                <button type="submit" name="cargar">Cargar archivo</button>
                <button type="submit" name="interpretar">Interpretar</button>
            </div>
        </form>
    </div>
    <div class="panel">
        <label>Salida:</label>
        <div class="salida">{{ salida }}</div>
        <div class="botones">
            <form method="get" action="/errores" style="display:inline;">
                <input type="hidden" name="data" value="{{ errores|e }}">
                <button type="submit">Reporte de Errores</button>
            </form>
            <form method="get" action="/tabla_simbolos" style="display:inline;">
                <button type="submit">Tabla de Símbolos</button>
            </form>
            <form method="get"style="display:inline;">
                <button type="submit">AST</button>
            </form>
        </div>
    </div>
</body>
</html>
